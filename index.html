<style>

.right-rail .ad-slot{min-height:170px}

</style>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
let originalPDFBytes=null,pageOrder=[],activeObjectUrls=[];
const toolNames={merge:"Merge PDFs",organize:"Organize PDF Pages",imagepdf:"Images to PDF",pdfimages:"PDF to PNG",background:"Background Remover",split:"Split PDF",compress:"Compress PDF",imagecompress:"Image Compressor",wordtools:"Word ↔ PDF"};
function status(message,error=false){const el=$("status");el.style.display="block";el.classList.toggle("error",error);el.textContent=message;}
function clearUrls(){activeObjectUrls.forEach(u=>URL.revokeObjectURL(u));activeObjectUrls=[];}
function trackUrl(blob){const u=URL.createObjectURL(blob);activeObjectUrls.push(u);return u;}
function downloadBlob(blob,name){if(!blob)throw Error("Could not create the output file.");const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function downloadBytes(bytes,name,type="application/pdf"){downloadBlob(new Blob([bytes],{type}),name);}
function formatBytes(n){if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(2)+" MB";}
function showPlanned(name){selectTool(name==="PDF Split"?"split":name==="PDF Compression"?"compress":name==="Image Compressor"?"imagecompress":"wordtools");status(name+" is on the roadmap and is not active yet.");}
function setPreview(title,state,note){$("previewTitle").textContent=title;$("previewState").textContent=state;$("previewNote").textContent=note||"Preview updates when you choose a file.";}
function emptyPreview(icon,title,description){clearUrls();$("livePreview").innerHTML="";const box=document.createElement("div");box.className="preview-empty";const big=document.createElement("span");big.className="big";big.textContent=icon;const strong=document.createElement("strong");strong.textContent=title;const p=document.createElement("p");p.textContent=description;box.append(big,strong,p);$("livePreview").appendChild(box);}
function addFilePreview(file,icon){$("livePreview").innerHTML="";const row=document.createElement("div");row.className="preview-file";const em=document.createElement("div");em.className="file-icon";em.textContent=icon;const info=document.createElement("div");const name=document.createElement("strong");name.textContent=file.name;const meta=document.createElement("small");meta.textContent=formatBytes(file.size)+" · "+(file.type||"File");info.append(name,meta);row.append(em,info);$("livePreview").appendChild(row);}
function selectTool(id){const card=document.querySelector('.tool-card[data-tool="'+id+'"]');if(!card)return;document.querySelectorAll(".tool-card").forEach(c=>c.classList.toggle("active",c===card));setPreview(toolNames[id]||"File preview","Ready","Select a file to see a preview here.");if(id==="merge")emptyPreview("📚","PDF merge preview","Choose two or more PDF files to see the files queued for merging.");else if(id==="organize")emptyPreview("🗂️","Page organizer","Load a PDF to see page thumbnails and their current order.");else if(id==="imagepdf")emptyPreview("🖼️","Image-to-PDF preview","Choose JPEG or PNG images to preview them before conversion.");else if(id==="pdfimages")emptyPreview("📑","PDF page preview","Choose a PDF to render its pages here.");else if(id==="background")emptyPreview("✂️","Background-removal preview","Choose an image to inspect it before processing.");else emptyPreview("♡",toolNames[id]||"Coming soon","This tool is planned but is not active yet.");}
document.querySelectorAll(".tool-card").forEach(card=>{card.addEventListener("click",e=>{if(!e.target.closest("button")&&!e.target.matches("input"))selectTool(card.dataset.tool);});});
document.querySelectorAll(".nav-button").forEach(btn=>btn.addEventListener("click",()=>{const group=btn.parentElement;const open=group.classList.toggle("open");btn.setAttribute("aria-expanded",String(open));document.querySelectorAll(".nav-group").forEach(other=>{if(other!==group){other.classList.remove("open");other.querySelector(".nav-button").setAttribute("aria-expanded","false");}});}));
document.addEventListener("click",e=>{if(!e.target.closest(".nav-group"))document.querySelectorAll(".nav-group").forEach(g=>{g.classList.remove("open");g.querySelector(".nav-button").setAttribute("aria-expanded","false");});if(e.target.closest(".dropdown a")){$("mainNav").classList.remove("mobile-open");$("mobileMenu").setAttribute("aria-expanded","false");}});
$("mobileMenu").addEventListener("click",()=>{const open=$("mainNav").classList.toggle("mobile-open");$("mobileMenu").setAttribute("aria-expanded",String(open));});
$("toolSearch").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".tool-card").forEach(card=>{card.classList.toggle("hidden",!card.dataset.name.includes(q)&&!card.innerText.toLowerCase().includes(q));});});
function previewFiles(files,icon){clearUrls();$("livePreview").innerHTML="";const list=document.createElement("div");list.style.cssText="display:grid;gap:8px;width:100%";files.forEach(f=>{const row=document.createElement("div");row.className="preview-file";const em=document.createElement("span");em.className="file-icon";em.textContent=icon;const info=document.createElement("div");const name=document.createElement("strong");name.textContent=f.name;const meta=document.createElement("small");meta.textContent=formatBytes(f.size);info.append(name,meta);row.append(em,info);list.appendChild(row);});$("livePreview").appendChild(list);setPreview("Selected files",files.length+" file"+(files.length===1?"":"s"),"Review the selected files before starting the operation.");}
$("mergeFiles").addEventListener("change",e=>{const fs=[...e.target.files];if(fs.length){previewFiles(fs,"📄");setPreview("Merge PDF preview",fs.length+" selected",fs.length<2?"Choose at least two PDF files to merge.":"Ready to merge in the order selected.");}else selectTool("merge");});
$("imageFiles").addEventListener("change",async e=>{const fs=[...e.target.files];if(!fs.length){selectTool("imagepdf");return;}clearUrls();$("livePreview").innerHTML="";const grid=document.createElement("div");grid.className="preview-pages";fs.slice(0,8).forEach((f,i)=>{const wrap=document.createElement("div");wrap.className="preview-page";const img=document.createElement("img");img.className="preview-image";img.style.maxHeight="110px";img.src=trackUrl(f);img.alt=f.name;const label=document.createElement("div");label.textContent=(i+1)+". "+f.name;wrap.append(img,label);grid.appendChild(wrap);});$("livePreview").appendChild(grid);setPreview("Image-to-PDF preview",fs.length+" image"+(fs.length===1?"":"s"),"Images will be placed one per PDF page. Preview shows up to eight images.");});
$("bgFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f){selectTool("background");return;}clearUrls();$("livePreview").innerHTML="";const img=document.createElement("img");img.className="preview-image";img.src=trackUrl(f);img.alt="Original image preview";$("livePreview").appendChild(img);setPreview("Original image", "Ready to remove", "The output should be a PNG with a transparent background.");});
$("renderFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f){selectTool("pdfimages");return;}try{status("Rendering preview...");const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;clearUrls();$("livePreview").innerHTML="";const grid=document.createElement("div");grid.className="preview-pages";for(let i=1;i<=Math.min(pdf.numPages,4);i++){const page=await pdf.getPage(i);const vp=page.getViewport({scale:.45});const canvas=document.createElement("canvas");canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const wrap=document.createElement("div");wrap.className="preview-page";wrap.append(canvas);const label=document.createElement("div");label.textContent="Page "+i;wrap.appendChild(label);grid.appendChild(wrap);}if(pdf.numPages>4){const more=document.createElement("p");more.className="preview-note";more.textContent=(pdf.numPages-4)+" more page(s) will also be converted.";grid.appendChild(more);} $("livePreview").appendChild(grid);setPreview("PDF page preview",pdf.numPages+" pages", "Showing up to four pages. All pages will be converted.");status("PDF preview ready.");}catch(err){status("Could not preview this PDF. Try another file.",true);}});
async function mergePDFs(){try{const files=[...$("mergeFiles").files];if(files.length<2)throw Error("Choose at least two PDF files.");status("Merging PDF files...");const out=await PDFLib.PDFDocument.create();for(const file of files){const src=await PDFLib.PDFDocument.load(await file.arrayBuffer());const copied=await out.copyPages(src,src.getPageIndices());copied.forEach(p=>out.addPage(p));}const bytes=await out.save();downloadBytes(bytes,"merged.pdf");setPreview("Merged PDF","Complete","Merged file downloaded · "+formatBytes(bytes.length));emptyPreview("✓","Merge complete","Your merged PDF has been downloaded.");status("Success! Your merged PDF is downloading.");}catch(e){status(e.message||"Unable to merge these PDFs.",true);}}
$("organizeFile").addEventListener("change",async e=>{try{const file=e.target.files[0];if(!file)return;selectTool("organize");status("Loading page thumbnails...");originalPDFBytes=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:originalPDFBytes.slice(0)}).promise;pageOrder=Array.from({length:pdf.numPages},(_,i)=>i);$("pages").innerHTML="";for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const vp=page.getViewport({scale:.35});const canvas=document.createElement("canvas");canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const item=document.createElement("div");item.className="page";item.dataset.index=i-1;item.appendChild(canvas);const label=document.createElement("div");label.className="pageLabel";item.appendChild(label);const controls=document.createElement("div");controls.className="controls";const up=document.createElement("button");up.className="secondary";up.textContent="↑";up.title="Move page up";up.onclick=()=>movePage(i-1,-1);const down=document.createElement("button");down.className="secondary";down.textContent="↓";down.title="Move page down";down.onclick=()=>movePage(i-1,1);const del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=()=>deletePage(i-1);controls.append(up,down,del);item.appendChild(controls);$("pages").appendChild(item);}refreshPageOrder();$("livePreview").innerHTML="";const info=document.createElement("div");info.className="preview-empty";const big=document.createElement("span");big.className="big";big.textContent="🗂️";const strong=document.createElement("strong");strong.textContent=pdf.numPages+" pages loaded";const p=document.createElement("p");p.textContent="Use the thumbnails on the tool card to reorder or delete pages. The preview follows your updated page order.";info.append(big,strong,p);$("livePreview").appendChild(info);setPreview("Page organizer",pdf.numPages+" pages","Thumbnails are shown in the main workspace.");status(pdf.numPages+" pages loaded. Use arrows to reorder or Delete to remove.");}catch(e){status("Could not read this PDF. Try another file.",true);}});
function refreshPageOrder(){const container=$("pages");pageOrder.forEach(index=>{const item=[...container.children].find(el=>Number(el.dataset.index)===index);if(item){container.appendChild(item);item.querySelector(".pageLabel").textContent="Page "+(pageOrder.indexOf(index)+1)+" (original "+(index+1)+")";}});}
function movePage(index,delta){const pos=pageOrder.indexOf(index),next=pos+delta;if(pos<0||next<0||next>=pageOrder.length)return;[pageOrder[pos],pageOrder[next]]=[pageOrder[next],pageOrder[pos]];refreshPageOrder();setPreview("Page organizer","Order updated","New order: "+pageOrder.map(i=>i+1).join(", "));}
function deletePage(index){if(pageOrder.length<=1){status("A PDF must contain at least one page.",true);return;}pageOrder=pageOrder.filter(i=>i!==index);const item=[...$("pages").children].find(el=>Number(el.dataset.index)===index);if(item)item.remove();refreshPageOrder();setPreview("Page organizer","Page removed","Remaining original pages: "+pageOrder.map(i=>i+1).join(", "));status("Page removed from output. Download to save changes.");}
async function saveOrganizedPDF(){try{if(!originalPDFBytes)throw Error("Choose a PDF first.");if(!pageOrder.length)throw Error("Keep at least one page.");status("Preparing updated PDF...");const src=await PDFLib.PDFDocument.load(originalPDFBytes);const out=await PDFLib.PDFDocument.create();const copied=await out.copyPages(src,pageOrder);copied.forEach(p=>out.addPage(p));const bytes=await out.save();downloadBytes(bytes,"organized.pdf");setPreview("Updated PDF","Complete",pageOrder.length+" pages · "+formatBytes(bytes.length));status("Updated PDF downloaded successfully.");}catch(e){status(e.message||"Could not save PDF.",true);}}
async function imagesToPDF(){try{const files=[...$("imageFiles").files];if(!files.length)throw Error("Choose one or more JPEG or PNG images.");status("Creating PDF...");const pdf=await PDFLib.PDFDocument.create();for(const file of files){const bytes=await file.arrayBuffer();let img;if(file.type==="image/png")img=await pdf.embedPng(bytes);else if(file.type==="image/jpeg"||file.type==="image/jpg")img=await pdf.embedJpg(bytes);else throw Error("Use JPEG or PNG images only.");const page=pdf.addPage([img.width,img.height]);page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});}const bytes=await pdf.save();downloadBytes(bytes,"images.pdf");setPreview("Image PDF","Complete",files.length+" pages · "+formatBytes(bytes.length));status("Your image PDF is ready.");}catch(e){status(e.message||"Image conversion failed. Use JPEG or PNG.",true);}}
async function pdfToImages(){try{const file=$("renderFile").files[0];if(!file)throw Error("Choose a PDF file first.");status("Rendering PDF pages...");const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const previewGrid=document.createElement("div");previewGrid.className="preview-pages";for(let i=1;i<=pdf.numPages;i++){status("Rendering page "+i+" of "+pdf.numPages+"...");const page=await pdf.getPage(i);const vp=page.getViewport({scale:1.5});const canvas=document.createElement("canvas");canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob)throw Error("Could not create PNG for page "+i);if(i<=4){const small=document.createElement("canvas");const smallVp=page.getViewport({scale:.35});small.width=Math.ceil(smallVp.width);small.height=Math.ceil(smallVp.height);await page.render({canvasContext:small.getContext("2d"),viewport:smallVp}).promise;const wrap=document.createElement("div");wrap.className="preview-page";wrap.append(small);const label=document.createElement("div");label.textContent="Page "+i;wrap.appendChild(label);previewGrid.appendChild(wrap);}downloadBlob(blob,"page-"+i+".png");} $("livePreview").innerHTML="";$("livePreview").appendChild(previewGrid);setPreview("PNG export","Complete",pdf.numPages+" page(s) rendered and downloaded.");status("Finished rendering. PNG pages should be downloading individually.");}catch(e){status(e.message||"Could not convert this PDF.",true);}}
async function removeBG(){const file=$("bgFile").files[0];if(!file){status("Choose an image first.",true);return;}try{status("Loading AI background-removal engine. First use may take a while...");const mod=await import("https://esm.sh/@imgly/background-removal@1.5.5");const removeBackground=mod.default;const result=await removeBackground(file);downloadBlob(result,"background-removed.png");const url=trackUrl(result);$("livePreview").innerHTML="";const img=document.createElement("img");img.className="preview-image";img.src=url;img.alt="Background removed transparent PNG preview";img.style.background="repeating-conic-gradient(#eee 0% 25%,white 0% 50%) 50%/16px 16px";$("livePreview").appendChild(img);setPreview("Background removed","Complete","Transparent PNG · "+formatBytes(result.size));$("bgResult")?.replaceChildren();status("Background removed. Transparent PNG download started.");}catch(e){console.error(e);status("Background removal could not start. Check browser console and AI model CDN availability.",true);}}
selectTool("merge");
</script>
